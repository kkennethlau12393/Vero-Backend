[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alexandria-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "openai>=1.0",
  "scipy>=1.11",
  "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
