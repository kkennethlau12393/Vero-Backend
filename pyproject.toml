[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alexandria-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "openai>=1.0",
  "scipy>=1.11",
  "numpy>=1.24",
  "PyMuPDF>=1.23",
  "python-multipart>=0.0.6",
  "rank-bm25>=0.2.2",
  "groq>=0.4",
  "PyJWT>=2.8",
  "cryptography>=42.0",
  "stripe>=8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: pure unit tests (no I/O)",
  "integration: tests that hit the DB or network",
  "quality: golden-set quality tests",
  "slow: tests that take >5 s",
  "live: live tests hitting real APIs (burns credits, never run by default)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
